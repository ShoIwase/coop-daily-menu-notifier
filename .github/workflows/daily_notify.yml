name: Daily Coop Menu Notify

on:
  schedule:
    # 月曜 18:00 JST = 09:00 UTC（週替わりメニューは月曜にまとめて1回通知）
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      debug_scrape:
        description: "スクレイピング各ステップのスクリーンショット/HTMLをアーティファクトとして保存する"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install poppler-utils (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Configure AWS credentials (Bedrock)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BEDROCK_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Run notifier
        run: npm start
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COOP_MEMBER_CODE: ${{ secrets.COOP_MEMBER_CODE }}
          COOP_PASSWORD: ${{ secrets.COOP_PASSWORD }}
          DEBUG_SCRAPE: ${{ inputs.debug_scrape && 'true' || 'false' }}
          USE_BEDROCK: "true"

      - name: Upload debug artifacts
        if: ${{ always() && inputs.debug_scrape }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-scrape-${{ github.run_id }}
          path: debug/
          retention-days: 3
