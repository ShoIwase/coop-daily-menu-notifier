name: Update Coop Menu Cache

on:
  schedule:
    # 月〜水 12:17 JST = 03:17 UTC。コープ側は「今週の次の週」の献立しか
    # 公開しないので、来週分を取得して data/menu-cache.json に保存する。
    # 来週分が取得済みなら何もしないので、実際に取得するのは通常月曜だけ。
    # 火・水は月曜が失敗したときの取り直し用。
    # 送信は自宅サーバーの IoT 朝レポート（7:00）が、このキャッシュから当日分を読んで行う。
    # 毎時00分は GitHub Actions の schedule が混雑して数時間遅れるため半端な分に置いている。
    - cron: "17 3 * * 1-3"
  workflow_dispatch:
    inputs:
      debug_scrape:
        description: "スクレイピング各ステップのスクリーンショット/HTMLをアーティファクトとして保存する"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install poppler-utils (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Configure AWS credentials (Bedrock)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BEDROCK_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Run notifier
        run: npm start
        env:
          COOP_MEMBER_CODE: ${{ secrets.COOP_MEMBER_CODE }}
          COOP_PASSWORD: ${{ secrets.COOP_PASSWORD }}
          DEBUG_SCRAPE: ${{ inputs.debug_scrape && 'true' || 'false' }}
          USE_BEDROCK: "true"

      - name: Commit updated menu cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/menu-cache.json
          git diff --cached --quiet || git commit -m "chore: update cached menu for next week"
          git push

      - name: Upload debug artifacts
        if: ${{ always() && inputs.debug_scrape }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-scrape-${{ github.run_id }}
          path: debug/
          retention-days: 3
