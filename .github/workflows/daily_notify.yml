name: Daily Coop Menu Notify

on:
  schedule:
    # 月曜 17:37 JST = 08:37 UTC（週替わりメニューは月曜にまとめて1回通知。
    # コープ側は「今週の次の週」の献立しか公開しないため、当日はキャッシュ
    # 済み＝今週配達分を送信し、この実行で取得した来週分を次回用に保存する）
    # 毎時00分は GitHub Actions の schedule が最も混雑して数時間遅れる
    # （2026-08-31 は 7 時間半遅延して翌 01:26 JST に実行）ため、
    # ピークを外した半端な分に置き、18時前に着くよう少し前倒ししている。
    - cron: "37 8 * * 1"
  workflow_dispatch:
    inputs:
      debug_scrape:
        description: "スクレイピング各ステップのスクリーンショット/HTMLをアーティファクトとして保存する"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install poppler-utils (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Configure AWS credentials (Bedrock)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BEDROCK_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Run notifier
        run: npm start
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COOP_MEMBER_CODE: ${{ secrets.COOP_MEMBER_CODE }}
          COOP_PASSWORD: ${{ secrets.COOP_PASSWORD }}
          DEBUG_SCRAPE: ${{ inputs.debug_scrape && 'true' || 'false' }}
          USE_BEDROCK: "true"

      - name: Commit updated menu cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/menu-cache.json
          git diff --cached --quiet || git commit -m "chore: update cached menu for next week"
          git push

      - name: Upload debug artifacts
        if: ${{ always() && inputs.debug_scrape }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-scrape-${{ github.run_id }}
          path: debug/
          retention-days: 3
